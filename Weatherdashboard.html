<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Dashboard</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>🌤️ Weather Dashboard</h1>
        <p class="subtitle">Check the current weather of any city</p>

        <div class="search-box">
            <input
                type="text"
                id="cityInput"
                placeholder="Enter city name"
            >

            <button onclick="getWeather()">Search</button>
        </div>

        <p id="errorMessage"></p>

        <div id="weatherCard" class="weather-card">

            <h2 id="cityName">City</h2>

            <div class="weather-icon">
                <img id="weatherIcon" src="" alt="Weather Icon">
            </div>

            <h3 id="temperature">-- °C</h3>

            <p id="description">Weather condition</p>

            <div class="weather-details">

                <div class="detail">
                    <span>💧</span>
                    <p>Humidity</p>
                    <strong id="humidity">--%</strong>
                </div>

                <div class="detail">
                    <span>💨</span>
                    <p>Wind Speed</p>
                    <strong id="windSpeed">-- m/s</strong>
                </div>

                <div class="detail">
                    <span>🌡️</span>
                    <p>Feels Like</p>
                    <strong id="feelsLike">-- °C</strong>
                </div>

                <div class="detail">
                    <span>📊</span>
                    <p>Pressure</p>
                    <strong id="pressure">-- hPa</strong>
                </div>

            </div>

        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
